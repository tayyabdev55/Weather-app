<body>
    <h1>Check weather</h1>

    <form onsubmit="Showwather(event)">

        <input  id="inp"  type="text"   placeholder="Enter your city">

    <p  id="tem"></p>
    <p id="feels"></p>
    <p  id="hum"></p>
    <p id="wind"></p>

    <script src="./app.js"></script>
